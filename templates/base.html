
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Susten Nutri - Portal Industrial</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<header class="cabeça_do_base">
    <div>
        <div class="logo-area">
            <h1>SUSTEN NUTRI</h1>
            <p>Industrial Portal</p>
        </div>

        <nav class="barra_dos_links">
            <a href="{{ url_for('dashboard') }}" class="barra_de_navegaçao {% if request.endpoint == 'dashboard' %}active{% endif %}">Dashboard</a>
            <a href="{{ url_for('galpoes') }}" class="barra_de_navegaçao {% if request.endpoint == 'galpoes' %}active{% endif %}">Galpões</a>
            <a href="{{ url_for('blocos') }}" class="barra_de_navegaçao {% if request.endpoint == 'blocos' %}active{% endif %}">Blocos</a>
            <a href="{{ url_for('setores') }}" class="barra_de_navegaçao {% if request.endpoint == 'setores' %}active{% endif %}">Setores</a>
            <a href="{{ url_for('sensores') }}" class="barra_de_navegaçao {% if request.endpoint == 'sensores' %}active{% endif %}">Sensores</a>
            <a href="{{ url_for('insumos') }}" class="barra_de_navegaçao {% if request.endpoint == 'insumos' %}active{% endif %}">Insumos</a>
            <a href="{{ url_for('leituras') }}" class="barra_de_navegaçao {% if request.endpoint == 'leituras' %}active{% endif %}">Leituras</a>
            <a href="{{ url_for('alertas') }}" class="barra_de_navegaçao {% if request.endpoint == 'alertas' %}active{% endif %}">Alertas</a>
        </nav>
    </div>

    <div class="barra_parte_configuraçao">
        <a href="{{ url_for('logout') }}" class="barra_de_navegaçao sair">Sair</a>
    </div>
</header>

<main class="fechamento">

    {% with mensagens = get_flashed_messages(with_categories=true) %}
        {% for categoria, mensagem in mensagens %}
            <div class="alert alert-{{ categoria }} alert-dismissible fade show" role="alert">
                {{ mensagem }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
