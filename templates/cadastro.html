
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro - Susten Nutri</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="corpo_do_home">

<div class="corpo_de_entrada">

    <div class="boas-vindas">
        <h1>SUSTEN NUTRI</h1>
        <p>Industrial Portal</p>
    </div>

    {% with mensagens = get_flashed_messages(with_categories=true) %}
        {% for categoria, mensagem in mensagens %}
            <div class="alert alert-{{ categoria }}">{{ mensagem }}</div>
        {% endfor %}
    {% endwith %}

    <h3>CADASTRO</h3>

    <form action="{{ url_for('cadastrar') }}" method="POST">

        <div class="campo-grupo">
            <label>Nome</label>
            <input type="text" name="form_nome" required>
        </div>

        <div class="campo-grupo">
            <label>Email</label>
            <input type="email" name="form_email" required>
        </div>

        <div class="campo-grupo">
            <label>CPF</label>
            <input type="text" name="form_cpf" minlength="11" maxlength="11" required>
        </div>

        <div class="campo-grupo">
            <label>Senha</label>
            <input type="password" name="form_senha" required>
        </div>

        <button type="submit" class="btn-verde">Cadastrar</button>

    </form>

    <p class="mt-3">
        Já tem conta?
        <a href="{{ url_for('login') }}">Login</a>
    </p>

</div>

</body>
</html>
