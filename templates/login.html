
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Susten Nutri</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="corpo_do_home">

<div class="corpo_de_entrada">

    <div class="boas-vindas">
        <h1>SUSTEN NUTRI</h1>
        <p>Industrial Portal</p>
        <span class="subtexto">Gerenciamento de insumos industriais</span>
    </div>

    {% with mensagens = get_flashed_messages(with_categories=true) %}
        {% for categoria, mensagem in mensagens %}
            <div class="alert alert-{{ categoria }}">{{ mensagem }}</div>
        {% endfor %}
    {% endwith %}

    <h3>LOGIN</h3>

    <form action="{{ url_for('login') }}" method="POST">

        <div class="campo-grupo">
            <label>Email</label>
            <input name="form_email" type="email" required>
        </div>

        <div class="campo-grupo">
            <label>Senha</label>
            <input name="form_senha" type="password" required>
        </div>

        <button type="submit" class="btn-verde">Entrar</button>

    </form>

    <p class="mt-3">
        Não tem conta?
        <a href="{{ url_for('cadastrar') }}">Cadastro</a>
    </p>

</div>

</body>
</html>
